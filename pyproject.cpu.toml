[project]
name = "3dsc2"
version = "0.1.0"
description = "3DS Camera View & Control (TAS & Event Replay) - No AI"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "pyqt6==6.7.1",
    "numpy",
    "pygame",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false